			alwaysOutOfDate = 1;
			buildActionMask = 2147483647;
			files = (
			);
			inputFileListPaths = (
			);
			inputPaths = (
			);
			name = "Strip embedded React Native frameworks";
			outputFileListPaths = (
			);
			outputPaths = (
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# Pods가 임베드한 동적 프레임워크는 Xcode가 스트립하지 않아 설치 크기가 커짐\n# Release 기기 빌드에서만 디버그 심볼과 로컬 심볼을 지움\n# PlystCore는 Xcode가 빌드하는 패키지라 대상이 아님\nif [[ \"$CONFIGURATION\" != Release || \"$PLATFORM_NAME\" != iphoneos ]]; then\n  exit 0\nfi\n\nfor framework in \"$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH\"/*.framework; do\n  name=$(basename \"$framework\" .framework)\n  [[ \"$name\" == PlystCore ]] && continue\n  binary=\"$framework/$name\"\n  file -b \"$binary\" | grep -q 'dynamically linked shared library' || continue\n  # strip이 서명 무효화 경고를 매번 출력하므로 실패했을 때만 출력을 보여 줌\n  if ! output=$(xcrun strip -S -x \"$binary\" 2>&1); then\n    echo \"error: $name 스트립 실패: $output\"\n    exit 1\n  fi\n  # 스트립으로 깨진 서명을 [CP] Embed Pods Frameworks와 같은 방식으로 다시 서명\n  if [[ -n \"${EXPANDED_CODE_SIGN_IDENTITY:-}\" && \"${CODE_SIGNING_REQUIRED:-}\" != NO && \"${CODE_SIGNING_ALLOWED}\" != NO ]]; then\n    /usr/bin/codesign --force --sign \"$EXPANDED_CODE_SIGN_IDENTITY\" ${OTHER_CODE_SIGN_FLAGS:-} --preserve-metadata=identifier,entitlements \"$framework\"\n  fi\ndone\n";
		};
