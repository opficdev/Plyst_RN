apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"

def repositoryRoot = file("../..")
def crate = new File(repositoryRoot, "core")
def bindingsDirectory = layout.buildDirectory.dir("generated/uniffi")

// 생성 Kotlin은 빌드 산출물이고 저장소에 두지 않음
def generateBindings = tasks.register("generatePlystCoreBindings", Exec) {
  inputs.dir(new File(crate, "src"))
  inputs.files(new File(crate, "Cargo.lock"), new File(crate, "uniffi.toml"))
  outputs.dir(bindingsDirectory)
  commandLine new File(repositoryRoot, "scripts/generate-plyst-core-bindings.sh"), "kotlin", bindingsDirectory.get().asFile
}

android {
  namespace "opfic.plyst.core"
  compileSdk rootProject.ext.compileSdkVersion
  ndkVersion rootProject.ext.ndkVersion
  defaultConfig {
    minSdkVersion rootProject.ext.minSdkVersion
    ndk {
      abiFilters(*findProperty("reactNativeArchitectures").split(","))
    }
    externalNativeBuild {
      cmake {
        // C 라이브러리라 Prefab의 STL 호환 검사에서 빠지도록 STL 없이 빌드
        arguments "-DANDROID_STL=none"
      }
    }
  }
  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }
  // 검색 C++ 모듈이 같은 libplyst_core.so를 링크하도록 C ABI 헤더와 함께 공개
  buildFeatures {
    prefabPublishing true
  }
  prefab {
    plyst_core {
      headers new File(crate, "include").path
    }
  }
  sourceSets {
    main {
      java.srcDir(bindingsDirectory)
    }
  }
}

tasks.named("preBuild") {
  dependsOn generateBindings
}

dependencies {
  // UniFFI 생성 Kotlin의 공개 형식에 JNA 타입이 드러남
  api "net.java.dev.jna:jna:5.17.0@aar"
}
