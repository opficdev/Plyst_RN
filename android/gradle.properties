# 프로젝트 전체 Gradle 설정
# IDE에서 지정한 Gradle 설정이 이 파일보다 우선

# Gradle 데몬의 JVM 메모리 설정
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# 서로 독립된 하위 프로젝트의 병렬 빌드
org.gradle.parallel=true

# AndroidX 패키지 사용
android.useAndroidX=true

# Release 빌드의 AAPT2 PNG 압축
android.enablePngCrunchInReleaseBuilds=true

# 빌드할 ABI 목록이며 명령줄의 -PreactNativeArchitectures로 바꿀 수 있음
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# TurboModule과 Fabric을 쓰는 New Architecture 사용
newArchEnabled=true

# Hermes 엔진 사용이며 끄면 JSC 사용
hermesEnabled=true

# 시스템 바 뒤까지 그리는 edge-to-edge 표시
edgeToEdgeEnabled=true

# React Native 이미지의 GIF 지원 (약 200B 증가)
expo.gif.enabled=true

# React Native 이미지의 WebP 지원 (약 85KB 증가)
expo.webp.enabled=true

# 움직이는 WebP 지원 (약 3.4MB 증가)이며 iOS가 지원하지 않아 끔
expo.webp.animated=false

# 개발 클라이언트의 네트워크 검사기
EX_DEV_CLIENT_NETWORK_INSPECTOR=true

# APK의 네이티브 라이브러리를 압축하는 이전 패키징 방식
expo.useLegacyPackaging=false

expo.inlineModules.watchedDirectories=[]
