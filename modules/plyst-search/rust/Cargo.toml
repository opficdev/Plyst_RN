[package]
name = "plyst-search-core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "plyst_search_core"
crate-type = ["staticlib", "rlib"]

[dependencies]
unicode-normalization = "=0.1.26"

[dev-dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "unwind"
