name: Android CI

# develop 푸시는 PR이 읽을 캐시를 만드는 실행
on:
  pull_request:
  push:
    branches:
      - develop

# 같은 PR이나 브랜치에 새 푸시가 오면 진행 중인 앞 실행 취소
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Android Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Set up tools
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
          install_args: node rust

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: mise exec -- npm ci

      # 커밋된 색과 이미지 리소스가 iOS 에셋 카탈로그와 같은지 확인
      - name: Check Android resources
        env:
          MISE_AUTO_INSTALL: 0
        run: make android-resources-check

      # CI 러너에만 필요한 값이라 android/gradle.properties가 아니라 사용자 수준 설정으로 지정
      # 기본값(힙 2GB, Metaspace 512MB)에서는 처음 빌드할 때 데몬이 Metaspace를 소진
      # 빌드 캐시를 켜서 바뀌지 않은 모듈의 작업 결과를 재사용
      # 저장소의 5xx 응답과 연결 오류는 Gradle이 실패한 요청만 재시도
      # 기본 재시도는 3초 안에 끝나 일시 오류를 넘기지 못함
      - name: Configure Gradle
        run: |
          mkdir -p ~/.gradle
          printf '%s\n' \
            'org.gradle.caching=true' \
            'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g' \
            'systemProp.org.gradle.internal.repository.max.tentatives=6' \
            'systemProp.org.gradle.internal.repository.initial.backoff=2000' >> ~/.gradle/gradle.properties

      - name: Cache Gradle wrapper
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-wrapper-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}

      # Gradle이 내려받은 의존성
      # 키가 달라도 같은 Gradle 버전의 최근 develop 캐시에서 시작해 바뀐 의존성만 내려받음
      # PR은 읽기만 함
      - name: Restore Gradle dependencies
        id: gradle-deps
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches/*
            !~/.gradle/caches/build-cache-1
          key: gradle-deps-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}-${{ hashFiles('package-lock.json', 'android/**/*.gradle') }}
          restore-keys: |
            gradle-deps-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}-

      # Gradle 빌드 캐시
      # develop 실행은 처음부터 빌드해 저장하고 PR은 읽기만 함
      - name: Restore Gradle build cache
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-build-cache-${{ runner.os }}-${{ hashFiles('package-lock.json', 'android/**/*.gradle') }}
          restore-keys: |
            gradle-build-cache-${{ runner.os }}-

      # 바인딩 생성기와 호스트용 core의 cargo 출력
      # develop 실행은 처음부터 빌드해 저장하고 PR은 읽기만 함
      - name: Restore cargo output
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: core/build/host
          key: cargo-host-${{ runner.os }}-${{ hashFiles('.mise.toml', 'core/Cargo.lock', 'core/bindgen/Cargo.lock') }}
          restore-keys: |
            cargo-host-${{ runner.os }}-

      - name: Build
        env:
          MISE_AUTO_INSTALL: 0
        run: make rn-android-build

      - name: Save Gradle dependencies
        if: github.event_name == 'push' && steps.gradle-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches/*
            !~/.gradle/caches/build-cache-1
          key: ${{ steps.gradle-deps.outputs.cache-primary-key }}

      - name: Save Gradle build cache
        if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-build-cache-${{ runner.os }}-${{ hashFiles('package-lock.json', 'android/**/*.gradle') }}

      - name: Save cargo output
        if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: core/build/host
          key: cargo-host-${{ runner.os }}-${{ hashFiles('.mise.toml', 'core/Cargo.lock', 'core/bindgen/Cargo.lock') }}
