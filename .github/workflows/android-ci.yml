name: Android CI

# develop 푸시는 PR이 읽을 캐시를 만드는 실행
on:
  pull_request:
  push:
    branches:
      - develop

# 같은 PR이나 브랜치에 새 푸시가 오면 진행 중인 앞 실행 취소
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Set up tools
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
          install_args: node rust

      # rn/android는 저장소에 없어 Gradle 캐시 키에 잠금 파일 사용
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: rn/package-lock.json

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('rn/package-lock.json') }}

      - name: Install dependencies
        working-directory: rn
        run: mise exec -- npm ci

      - name: Build
        env:
          MISE_AUTO_INSTALL: 0
        run: make rn-android-build
