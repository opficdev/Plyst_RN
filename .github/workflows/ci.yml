name: iOS CI

# develop 푸시는 PR이 읽을 캐시를 만드는 실행
on:
  pull_request:
  push:
    branches:
      - develop

# 같은 PR이나 브랜치에 새 푸시가 오면 진행 중인 앞 실행 취소
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# 시뮬레이터 x86_64 슬라이스는 CI에서 만들지 않음
# Build와 Test는 arm64 시뮬레이터에서만 실행
env:
  RN_XCFRAMEWORK_SIMULATOR_ARCHS: arm64

jobs:
  lint:
    name: SwiftLint
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up SwiftLint
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
          install_args: aqua:realm/SwiftLint

      - name: Lint
        env:
          MISE_AUTO_INSTALL: 0
        run: make lint

  # macOS 동시 실행 수를 아끼려고 Linux에서 실행
  js:
    name: JS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
          install_args: node

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: mise exec -- npm ci

      - name: Type check
        env:
          MISE_AUTO_INSTALL: 0
        run: make rn-typecheck

      - name: Lint
        env:
          MISE_AUTO_INSTALL: 0
        run: make rn-lint

      - name: Test
        env:
          MISE_AUTO_INSTALL: 0
        run: make rn-test

  # PlystCore와 PlystSearchCore를 먼저 만들어 올린 뒤 Rust 검사를 실행
  # Test 잡은 업로드만 기다리고 Build 잡은 검사 종료까지 기다림
  rust:
    name: Rust
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up Rust
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
          install_args: rust

      - name: Read Xcode version
        id: xcode
        run: echo "version=$(xcodebuild -version | tr '\n ' '--')" >> "$GITHUB_OUTPUT"

      - name: Hash Rust inputs
        id: input-hash
        run: |
          echo "core=$(scripts/rust-inputs.sh core)" >> "$GITHUB_OUTPUT"
          echo "search=$(scripts/rust-inputs.sh search)" >> "$GITHUB_OUTPUT"

      - name: Cache Plyst core
        id: core-cache
        uses: actions/cache@v4
        with:
          path: |
            ios/Packages/PlystCore/Frameworks
            ios/Packages/PlystCore/Sources
          key: plyst-core-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ env.RN_XCFRAMEWORK_SIMULATOR_ARCHS }}-${{ steps.input-hash.outputs.core }}

      - name: Cache Plyst search
        id: search-cache
        uses: actions/cache@v4
        with:
          path: |
            modules/plyst-search/build/PlystSearchCore.xcframework
            modules/plyst-search/build/.inputs
          key: plyst-search-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ env.RN_XCFRAMEWORK_SIMULATOR_ARCHS }}-${{ steps.input-hash.outputs.search }}

      # core와 바인딩 생성기의 cargo 출력
      # develop 실행은 처음부터 빌드해 저장하고 PR은 읽기만 함
      - name: Restore cargo output
        if: github.event_name == 'pull_request' && steps.core-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            core/build/target
            core/build/host
          key: cargo-ios-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ env.RN_XCFRAMEWORK_SIMULATOR_ARCHS }}-${{ hashFiles('.mise.toml', 'core/Cargo.lock', 'core/bindgen/Cargo.lock') }}

      - name: Build Plyst core
        env:
          MISE_AUTO_INSTALL: 0
        run: make plyst-core

      - name: Build Plyst search
        env:
          MISE_AUTO_INSTALL: 0
        run: make plyst-search

      - name: Archive Rust frameworks
        run: tar -cf rust-frameworks.tar ios/Packages/PlystCore/Frameworks ios/Packages/PlystCore/Sources modules/plyst-search/build/PlystSearchCore.xcframework modules/plyst-search/build/.inputs

      # 잡 전체를 다시 실행하면 같은 이름의 앞 산출물을 덮음
      - name: Upload Rust frameworks
        uses: actions/upload-artifact@v4
        with:
          name: rust-frameworks
          path: rust-frameworks.tar
          overwrite: true

      - name: Save cargo output
        if: github.event_name == 'push' && steps.core-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            core/build/target
            core/build/host
          key: cargo-ios-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ env.RN_XCFRAMEWORK_SIMULATOR_ARCHS }}-${{ hashFiles('.mise.toml', 'core/Cargo.lock', 'core/bindgen/Cargo.lock') }}

      - name: Lint Rust core
        env:
          MISE_AUTO_INSTALL: 0
        run: make rn-rust-lint

      - name: Test Rust core
        env:
          MISE_AUTO_INSTALL: 0
        run: make rn-rust-test

  # Build는 Rust를 기다리고 건너뛴 필수 체크는 통과로 처리됨
  # 선행 잡이 실패해도 실행해 이 필수 체크를 실패로 끝냄
  # develop 실행은 Pods와 컴파일 캐시를 저장하려고 함께 빌드
  build:
    # 잡 이름은 필수 상태 체크 이름과 같아야 함
    name: Build
    if: ${{ !cancelled() }}
    needs: [rust]
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - name: Check required jobs
        if: needs.rust.result != 'success'
        env:
          RUST_RESULT: ${{ needs.rust.result }}
        run: |
          printf '::error title=선행 잡::Rust=%s\n' "$RUST_RESULT"
          exit 1

      - uses: actions/checkout@v5

      - name: Set up Node
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
          install_args: node

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: mise exec -- npm ci

      - name: Download Rust frameworks
        uses: actions/download-artifact@v4
        with:
          name: rust-frameworks
          path: /tmp/rust-frameworks

      - name: Extract Rust frameworks
        run: tar -xf /tmp/rust-frameworks/rust-frameworks.tar

      - name: Read Xcode version
        id: xcode
        run: echo "version=$(xcodebuild -version | tr '\n ' '--')" >> "$GITHUB_OUTPUT"

      # 내려받은 사전 빌드 React Native와 Pods 소스
      # develop 실행은 처음부터 설치해 저장하고 PR은 읽기만 함
      - name: Restore Pods
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('ios/Podfile.lock', 'package-lock.json') }}

      # PlystSearchCore는 Rust 잡이 만들므로 선행 타깃을 건너뜀
      - name: Install Pods
        env:
          MISE_AUTO_INSTALL: 0
        run: make -o plyst-search pods

      # Xcode 컴파일 캐시
      # develop 실행은 처음부터 빌드해 저장하고 PR은 읽기만 함
      - name: Restore compilation cache
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/compilation-cache
          key: compilation-cache-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ env.RN_XCFRAMEWORK_SIMULATOR_ARCHS }}-${{ hashFiles('ios/Podfile.lock', 'package-lock.json') }}

      # Pods와 앱 컴파일 결과를 러너 임시 폴더의 CAS에 캐시
      - name: Build
        env:
          MISE_AUTO_INSTALL: 0
        run: make build XCODEBUILD_FLAGS="ARCHS=${{ env.RN_XCFRAMEWORK_SIMULATOR_ARCHS }} COMPILATION_CACHE_ENABLE_CACHING=YES SWIFT_ENABLE_EXPLICIT_MODULES=YES COMPILATION_CACHE_CAS_PATH=${{ runner.temp }}/compilation-cache COMPILER_INDEX_STORE_ENABLE=NO"

      - name: Save Pods
        if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('ios/Podfile.lock', 'package-lock.json') }}

      - name: Save compilation cache
        if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/compilation-cache
          key: compilation-cache-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ env.RN_XCFRAMEWORK_SIMULATOR_ARCHS }}-${{ hashFiles('ios/Podfile.lock', 'package-lock.json') }}

  # 산출물을 기다리지 않고 시작해 시뮬레이터를 먼저 부팅
  # 빌드는 다른 러너에서 진행되므로 이 러너에서는 부팅과 빌드가 겹치지 않음
  test:
    # 잡 이름은 필수 상태 체크 이름과 같아야 함
    name: Test
    if: github.event_name == 'pull_request'
    runs-on: xcode-27
    timeout-minutes: 70
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5

      - name: Select simulator
        timeout-minutes: 2
        run: echo "TEST_DEVICE_ID=$(make -s test-device-id)" >> "$GITHUB_ENV"

      # simslim은 부팅 시간을 줄이는 최적화이고 테스트는 simslim이 끄는 데몬에 의존하지 않음
      # 설치나 적용이 실패하면 경고만 남기고 기본 상태 시뮬레이터로 진행
      - name: Install simslim
        id: simslim
        continue-on-error: true
        timeout-minutes: 2
        env:
          SIMSLIM_VERSION: 0.12.2
          SIMSLIM_SHA256: b47302da6fb83b8b4c21f4fdd61507469770c07b0ff07fd1f48207bda4270887
        run: |
          archive="$RUNNER_TEMP/simslim.tar.gz"
          directory="$RUNNER_TEMP/simslim"
          mkdir -p "$directory"
          if curl -fsSL --retry 3 -o "$archive" "https://github.com/MobAI-App/simslim/releases/download/v$SIMSLIM_VERSION/simslim-v$SIMSLIM_VERSION-macos-arm64.tar.gz" \
            && echo "$SIMSLIM_SHA256  $archive" | shasum -a 256 -c - \
            && tar -xzf "$archive" -C "$directory" simslim \
            && "$directory/simslim" --version; then
            echo "path=$directory/simslim" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=simslim::설치에 실패해 기본 상태 시뮬레이터로 진행합니다."
          fi

      # 종료 상태의 시뮬레이터에 적용하면 simslim이 비활성화 목록을 기록한 뒤 한 번만 부팅
      # 제한 시간이 지나도 진행 중인 부팅은 다음 단계가 기다림
      - name: Slim simulator
        if: steps.simslim.outputs.path != ''
        continue-on-error: true
        timeout-minutes: 4
        env:
          SIMSLIM: ${{ steps.simslim.outputs.path }}
          SIMSLIM_BOOT_TIMEOUT: 3m
        run: |
          if "$SIMSLIM" on "$TEST_DEVICE_ID"; then
            "$SIMSLIM" status "$TEST_DEVICE_ID" || true
          else
            echo "::warning title=simslim::적용에 실패해 기본 상태 시뮬레이터로 진행합니다."
          fi

      - name: Boot simulator
        timeout-minutes: 5
        run: |
          # 종료 상태가 아니면 부팅 명령을 보내지 않음
          # 부팅이 완료될 때까지 기다림
          if xcrun simctl list devices | grep "$TEST_DEVICE_ID" | grep -q "(Shutdown)"; then
            xcrun simctl boot "$TEST_DEVICE_ID"
          fi
          xcrun simctl bootstatus "$TEST_DEVICE_ID" -b

      # Rust 산출물이 올라오면 끝남
      # Rust 잡이 산출물 없이 끝나면 실패로 끝남
      # API 호출이 일시적으로 실패하면 다음 확인까지 기다림
      - name: Wait for Rust frameworks
        timeout-minutes: 35
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          while :; do
            if ! names=$(gh api "$run/artifacts" --jq '.artifacts[].name'); then
              sleep 10
              continue
            fi
            if printf '%s\n' "$names" | grep -qx rust-frameworks; then
              break
            fi
            if ! failed=$(gh api "$run/attempts/$GITHUB_RUN_ATTEMPT/jobs" --paginate \
              --jq '.jobs[] | select(.name == "Rust" and .status == "completed" and .conclusion != "success") | .name'); then
              sleep 10
              continue
            fi
            if [ -n "$failed" ]; then
              printf '::error title=산출물 대기::Rust 잡이 산출물 없이 끝났습니다.\n'
              exit 1
            fi
            sleep 10
          done

      - name: Set up Node
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
          install_args: node

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: mise exec -- npm ci

      - name: Download Rust frameworks
        uses: actions/download-artifact@v4
        with:
          name: rust-frameworks
          path: /tmp/rust-frameworks

      - name: Extract Rust frameworks
        run: tar -xf /tmp/rust-frameworks/rust-frameworks.tar

      - name: Read Xcode version
        id: xcode
        run: echo "version=$(xcodebuild -version | tr '\n ' '--')" >> "$GITHUB_OUTPUT"

      - name: Restore Pods
        uses: actions/cache/restore@v4
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('ios/Podfile.lock', 'package-lock.json') }}

      # PlystSearchCore는 Rust 잡이 만들므로 선행 타깃을 건너뜀
      - name: Install Pods
        env:
          MISE_AUTO_INSTALL: 0
        run: make -o plyst-search pods

      - name: Restore compilation cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/compilation-cache
          key: compilation-cache-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ env.RN_XCFRAMEWORK_SIMULATOR_ARCHS }}-${{ hashFiles('ios/Podfile.lock', 'package-lock.json') }}

      - name: Build for testing
        timeout-minutes: 30
        env:
          MISE_AUTO_INSTALL: 0
        run: make test-build DESTINATION="platform=iOS Simulator,id=$TEST_DEVICE_ID" XCODEBUILD_FLAGS="COMPILATION_CACHE_ENABLE_CACHING=YES SWIFT_ENABLE_EXPLICIT_MODULES=YES COMPILATION_CACHE_CAS_PATH=${{ runner.temp }}/compilation-cache COMPILER_INDEX_STORE_ENABLE=NO"

      # 병렬 테스트는 복제 시뮬레이터 부팅 지연과 멈춤의 원인으로 의심되어 CI에서만 끔
      - name: Test
        timeout-minutes: 9
        run: make test-without-building XCODEBUILD_FLAGS="-parallel-testing-enabled NO -skipPackageUpdates -disableAutomaticPackageResolution"

      - name: Test summary
        if: always()
        timeout-minutes: 2
        run: |
          if [ -f /tmp/plyst-test-results.xcresult/Info.plist ]; then
            xcrun xcresulttool get test-results summary --path /tmp/plyst-test-results.xcresult
          fi

      - name: Simulator diagnostics
        if: failure()
        timeout-minutes: 3
        run: |
          xcrun simctl list devices
          xcrun simctl spawn "$TEST_DEVICE_ID" log show --last 15m --style compact \
            --predicate 'process == "testmanagerd" OR process == "launchd_sim" OR subsystem CONTAINS "XCTest"' | tail -n 200 || true
          ls -l ~/Library/Logs/DiagnosticReports || true
