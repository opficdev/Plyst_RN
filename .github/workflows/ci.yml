name: iOS CI

# develop 푸시는 PR이 읽을 캐시를 만드는 실행
on:
  pull_request:
  push:
    branches:
      - develop
      # 실험 기간에만 시험 PR이 읽을 캐시를 만드는 실행
      - "ci/#115"

# 같은 PR이나 브랜치에 새 푸시가 오면 진행 중인 앞 실행 취소
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: SwiftLint
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up SwiftLint
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
          install_args: aqua:realm/SwiftLint

      - name: Lint
        env:
          MISE_AUTO_INSTALL: 0
        run: make lint

  # macOS 동시 실행 수를 아끼려고 Linux에서 실행
  js:
    name: JS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
          install_args: node

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('rn/package-lock.json') }}

      - name: Install dependencies
        working-directory: rn
        run: mise exec -- npm ci

      - name: Type check
        env:
          MISE_AUTO_INSTALL: 0
        run: make rn-typecheck

      - name: Lint
        env:
          MISE_AUTO_INSTALL: 0
        run: make rn-lint

      - name: Test
        env:
          MISE_AUTO_INSTALL: 0
        run: make rn-test

  # PlystCore를 먼저 만들어 올린 뒤 Rust 검사를 실행
  # Test 잡은 업로드만 기다리고 Build 잡은 검사 종료까지 기다림
  rust:
    name: Rust
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up Rust
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
          install_args: rust

      - name: Read Xcode version
        id: xcode
        run: echo "version=$(xcodebuild -version | tr '\n ' '--')" >> "$GITHUB_OUTPUT"

      - name: Hash Plyst core inputs
        id: input-hash
        run: echo "core=$(scripts/rn-xcframework-inputs.sh core)" >> "$GITHUB_OUTPUT"

      - name: Cache Plyst core
        uses: actions/cache@v4
        with:
          path: |
            Plyst/Packages/PlystCore/Frameworks
            Plyst/Packages/PlystCore/Sources
          key: plyst-core-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ steps.input-hash.outputs.core }}

      - name: Build Plyst core
        env:
          MISE_AUTO_INSTALL: 0
        run: make plyst-core

      - name: Archive Plyst core
        run: tar -C Plyst/Packages -cf plyst-core.tar PlystCore/Frameworks PlystCore/Sources

      # 잡 전체를 다시 실행하면 같은 이름의 앞 산출물을 덮음
      - name: Upload Plyst core
        uses: actions/upload-artifact@v4
        with:
          name: plyst-core
          path: plyst-core.tar
          overwrite: true

      - name: Lint Rust core
        env:
          MISE_AUTO_INSTALL: 0
        run: make rn-rust-lint

      - name: Test Rust core
        env:
          MISE_AUTO_INSTALL: 0
        run: make rn-rust-test

  xcframework:
    name: XCFramework
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up tools
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true
          install_args: node rust

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('rn/package-lock.json') }}

      - name: Read Xcode version
        id: xcode
        run: echo "version=$(xcodebuild -version | tr '\n ' '--')" >> "$GITHUB_OUTPUT"

      - name: Hash XCFramework inputs
        id: input-hash
        run: echo "hash=$(scripts/rn-xcframework-inputs.sh)" >> "$GITHUB_OUTPUT"

      - name: Cache XCFrameworks
        id: xcframework-cache
        uses: actions/cache@v4
        with:
          path: Plyst/Packages/PlystReactNative/Frameworks
          key: rn-xcframework-${{ runner.os }}-${{ steps.xcode.outputs.version }}-${{ steps.input-hash.outputs.hash }}

      # PlystCore는 Rust 잡이 만들므로 선행 타깃을 건너뜀
      - name: Build XCFrameworks
        if: steps.xcframework-cache.outputs.cache-hit != 'true'
        env:
          MISE_AUTO_INSTALL: 0
        run: make -o plyst-core rn-xcframework

      - name: Archive XCFrameworks
        run: tar -C Plyst/Packages -cf rn-xcframeworks.tar PlystReactNative/Frameworks

      - name: Upload XCFrameworks
        uses: actions/upload-artifact@v4
        with:
          name: rn-xcframeworks
          path: rn-xcframeworks.tar
          overwrite: true

  # Rust는 필수 체크가 아니고 건너뛴 필수 체크는 통과로 처리됨
  # 선행 잡이 실패해도 실행해 이 필수 체크를 실패로 끝냄
  build:
    # 잡 이름은 필수 상태 체크 이름과 같아야 함
    name: Build
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    needs: [xcframework, rust]
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - name: Check required jobs
        if: needs.xcframework.result != 'success' || needs.rust.result != 'success'
        env:
          XCFRAMEWORK_RESULT: ${{ needs.xcframework.result }}
          RUST_RESULT: ${{ needs.rust.result }}
        run: |
          printf '::error title=선행 잡::XCFramework=%s, Rust=%s\n' "$XCFRAMEWORK_RESULT" "$RUST_RESULT"
          exit 1

      - uses: actions/checkout@v5

      - name: Download XCFrameworks
        uses: actions/download-artifact@v4
        with:
          name: rn-xcframeworks
          path: /tmp/rn-xcframeworks

      - name: Download Plyst core
        uses: actions/download-artifact@v4
        with:
          name: plyst-core
          path: /tmp/plyst-core

      - name: Extract frameworks
        run: |
          tar -C Plyst/Packages -xf /tmp/rn-xcframeworks/rn-xcframeworks.tar
          tar -C Plyst/Packages -xf /tmp/plyst-core/plyst-core.tar

      - name: Build
        run: make build

  # 산출물을 기다리지 않고 시작해 시뮬레이터를 먼저 부팅
  # 빌드는 다른 러너에서 진행되므로 이 러너에서는 부팅과 빌드가 겹치지 않음
  test:
    # 잡 이름은 필수 상태 체크 이름과 같아야 함
    name: Test
    if: github.event_name == 'pull_request'
    runs-on: xcode-27
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5

      - name: Select simulator
        timeout-minutes: 2
        run: echo "TEST_DEVICE_ID=$(make -s test-device-id)" >> "$GITHUB_ENV"

      # simslim은 부팅 시간을 줄이는 최적화이고 테스트는 simslim이 끄는 데몬에 의존하지 않음
      # 설치나 적용이 실패하면 경고만 남기고 기본 상태 시뮬레이터로 진행
      - name: Install simslim
        id: simslim
        continue-on-error: true
        timeout-minutes: 2
        env:
          SIMSLIM_VERSION: 0.12.2
          SIMSLIM_SHA256: b47302da6fb83b8b4c21f4fdd61507469770c07b0ff07fd1f48207bda4270887
        run: |
          archive="$RUNNER_TEMP/simslim.tar.gz"
          directory="$RUNNER_TEMP/simslim"
          mkdir -p "$directory"
          if curl -fsSL --retry 3 -o "$archive" "https://github.com/MobAI-App/simslim/releases/download/v$SIMSLIM_VERSION/simslim-v$SIMSLIM_VERSION-macos-arm64.tar.gz" \
            && echo "$SIMSLIM_SHA256  $archive" | shasum -a 256 -c - \
            && tar -xzf "$archive" -C "$directory" simslim \
            && "$directory/simslim" --version; then
            echo "path=$directory/simslim" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=simslim::설치에 실패해 기본 상태 시뮬레이터로 진행합니다."
          fi

      # 종료 상태의 시뮬레이터에 적용하면 simslim이 비활성화 목록을 기록한 뒤 한 번만 부팅
      # 제한 시간이 지나도 진행 중인 부팅은 다음 단계가 기다림
      - name: Slim simulator
        if: steps.simslim.outputs.path != ''
        continue-on-error: true
        timeout-minutes: 4
        env:
          SIMSLIM: ${{ steps.simslim.outputs.path }}
          SIMSLIM_BOOT_TIMEOUT: 3m
        run: |
          if "$SIMSLIM" on "$TEST_DEVICE_ID"; then
            "$SIMSLIM" status "$TEST_DEVICE_ID" || true
          else
            echo "::warning title=simslim::적용에 실패해 기본 상태 시뮬레이터로 진행합니다."
          fi

      - name: Boot simulator
        timeout-minutes: 5
        run: |
          # 종료 상태가 아니면 부팅 명령을 보내지 않음
          # 부팅이 완료될 때까지 기다림
          if xcrun simctl list devices | grep "$TEST_DEVICE_ID" | grep -q "(Shutdown)"; then
            xcrun simctl boot "$TEST_DEVICE_ID"
          fi
          xcrun simctl bootstatus "$TEST_DEVICE_ID" -b

      # 두 산출물이 모두 올라오면 끝남
      # 만드는 잡이 산출물 없이 끝나면 실패로 끝남
      - name: Wait for frameworks
        timeout-minutes: 35
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          while :; do
            names=$(gh api "$run/artifacts" --jq '.artifacts[].name')
            if printf '%s\n' "$names" | grep -qx rn-xcframeworks \
              && printf '%s\n' "$names" | grep -qx plyst-core; then
              break
            fi
            failed=$(gh api "$run/attempts/$GITHUB_RUN_ATTEMPT/jobs" --paginate \
              --jq '.jobs[] | select((.name == "XCFramework" or .name == "Rust") and .status == "completed" and .conclusion != "success") | .name')
            if [ -n "$failed" ]; then
              printf '::error title=산출물 대기::%s 잡이 산출물 없이 끝났습니다.\n' "$(printf '%s' "$failed" | tr '\n' ' ')"
              exit 1
            fi
            sleep 10
          done

      - name: Download XCFrameworks
        uses: actions/download-artifact@v4
        with:
          name: rn-xcframeworks
          path: /tmp/rn-xcframeworks

      - name: Download Plyst core
        uses: actions/download-artifact@v4
        with:
          name: plyst-core
          path: /tmp/plyst-core

      - name: Extract frameworks
        run: |
          tar -C Plyst/Packages -xf /tmp/rn-xcframeworks/rn-xcframeworks.tar
          tar -C Plyst/Packages -xf /tmp/plyst-core/plyst-core.tar

      - name: Build for testing
        timeout-minutes: 12
        run: make test-build DESTINATION="platform=iOS Simulator,id=$TEST_DEVICE_ID"

      # 병렬 테스트는 복제 시뮬레이터 부팅 지연과 멈춤의 원인으로 의심되어 CI에서만 끔
      - name: Test
        timeout-minutes: 9
        run: make test-without-building XCODEBUILD_FLAGS="-parallel-testing-enabled NO -skipPackageUpdates -disableAutomaticPackageResolution"

      - name: Test summary
        if: always()
        timeout-minutes: 2
        run: |
          if [ -f /tmp/plyst-test-results.xcresult/Info.plist ]; then
            xcrun xcresulttool get test-results summary --path /tmp/plyst-test-results.xcresult
          fi

      - name: Simulator diagnostics
        if: failure()
        timeout-minutes: 3
        run: |
          xcrun simctl list devices
          xcrun simctl spawn "$TEST_DEVICE_ID" log show --last 15m --style compact \
            --predicate 'process == "testmanagerd" OR process == "launchd_sim" OR subsystem CONTAINS "XCTest"' | tail -n 200 || true
          ls -l ~/Library/Logs/DiagnosticReports || true
